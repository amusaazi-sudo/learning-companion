[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-companion"
version = "1.1.0"
description = "A command-line study tool that uses an LLM to generate quiz questions, grade answers and track progress."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aliyer Bakers Musaazi" }]
dependencies = [
    "openai>=2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
learning-companion = "learning_companion.cli.app:main"

[tool.setuptools.packages.find]
include = ["learning_companion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
